name: Sync upstream

on:
    schedule:
        - cron: '23 4 * * *'
    workflow_dispatch: {}

permissions:
    contents: write

jobs:
    sync:
        if: github.repository == 'reloxx13/ioBroker.philips-air-cloud'
        runs-on: ubuntu-latest
        steps:
            - name: Merge upstream master
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh api --method POST "repos/$GITHUB_REPOSITORY/merge-upstream" --field branch=master
